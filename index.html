<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>健身教练排课</title>
<meta name="theme-color" content="#1f6feb">
<meta name="description" content="移动端健身教练排课工具：会员管理、对话排课、冲突检测、课时扣减">
<!-- PWA / 添加到主屏幕 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="教练排课">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1 id="topbar-title">课表</h1>
  <div id="topbar-right"></div>
</header>

<main id="main">

  <!-- ========== 课表：日历 + 当天列表 ========== -->
  <section class="view" id="view-schedule">
    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="icon-btn" id="cal-prev" aria-label="上个月">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="icon-btn" id="cal-next" aria-label="下个月">›</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="day-strip" id="day-strip"></div>

    <div class="day-section">
      <div class="day-section-title" id="day-title"></div>
      <div id="day-lessons" class="lesson-list"></div>
    </div>

    <button class="fab" id="fab-book" aria-label="对话排课">＋</button>
  </section>

  <!-- ========== 对话排课 ========== -->
  <section class="view" id="view-chat" hidden>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-chips" id="chat-chips">
      <button class="chip" data-text="今天有什么课">今天课表</button>
      <button class="chip" data-text="明天有课吗">明天有课吗</button>
      <button class="chip" data-text="帮我约课">帮我约课</button>
      <button class="chip" data-text="帮助">帮助</button>
    </div>
    <form class="chat-input-bar" id="chat-form">
      <input type="text" id="chat-input" placeholder="例如：明天下午3点给张三排一节私教"
             autocomplete="off" enterkeyhint="send">
      <button type="submit" class="send-btn" aria-label="发送">发送</button>
    </form>
  </section>

  <!-- ========== 会员管理 ========== -->
  <section class="view" id="view-members" hidden>
    <div class="members-toolbar">
      <input type="search" id="member-search" class="search-input" placeholder="搜索姓名 / 手机号">
      <button class="primary-btn" id="btn-add-member">＋ 新会员</button>
    </div>
    <div id="member-list" class="member-list"></div>
  </section>

  <!-- ========== 设置 / 备份 ========== -->
  <section class="view" id="view-settings" hidden>
    <div class="stats-grid" id="stats-grid"></div>

    <div class="setting-card">
      <div class="setting-title">默认课程时长（分钟）</div>
      <div class="seg" id="seg-duration">
        <button data-val="30">30</button>
        <button data-val="45">45</button>
        <button data-val="60">60</button>
        <button data-val="90">90</button>
      </div>
    </div>

    <div class="setting-card">
      <div class="setting-title">数据备份（IndexedDB 本地数据库）</div>
      <p class="setting-desc">数据保存在本机浏览器的 IndexedDB 中，容量更大、更不容易被系统清理。换手机、恢复出厂或清除浏览器数据前，请先导出备份。</p>
      <div class="setting-actions">
        <button class="primary-btn" id="btn-export">导出备份</button>
        <button class="secondary-btn" id="btn-import">导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>

    <div class="setting-card danger-zone">
      <div class="setting-title">危险操作</div>
      <button class="danger-btn" id="btn-clear">清空全部数据</button>
    </div>

    <p class="app-version">健身教练排课 · 数据仅保存在本机浏览器，换手机或清缓存前请先导出备份</p>
  </section>

</main>

<!-- 底部导航 -->
<nav class="tabbar">
  <button class="tab active" data-view="schedule">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    <span class="tab-txt">课表</span>
  </button>
  <button class="tab" data-view="chat">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span class="tab-txt">排课</span>
  </button>
  <button class="tab" data-view="members">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="tab-txt">会员</span>
  </button>
  <button class="tab" data-view="settings">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    <span class="tab-txt">设置</span>
  </button>
</nav>

<!-- 弹窗容器 -->
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
